name: Manual Scrape

on:
  workflow_dispatch:
    inputs:
      wiki:
        description: "Scrape wiki content"
        required: false
        type: boolean
        default: false
      forum:
        description: "Scrape forum content"
        required: false
        type: boolean
        default: false
      docs:
        description: "Scrape documentation"
        required: false
        type: boolean
        default: false
      packages:
        description: "Scrape packages list"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    name: Run selected scrapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run wiki scraper
        if: ${{ inputs.wiki }}
        run: pnpm run scrape:wiki || true

      - name: Run forum scraper
        if: ${{ inputs.forum }}
        run: pnpm run scrape:forum || true

      - name: Run docs scraper
        if: ${{ inputs.docs }}
        run: pnpm run scrape:docs || true

      - name: Run packages scraper
        if: ${{ inputs.packages }}
        run: pnpm run scrape:packages || true

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update scraped content [$(date -u +%Y-%m-%d)]"
          git push

      - name: Build verification
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build
