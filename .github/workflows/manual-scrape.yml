name: Manual Scrape

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force full scrape (ignore cache policy)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (show decisions, do not scrape or save state)"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    name: Scrape devkitPro content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scrapers
        id: scrape
        run: |
          args=""
          [ "${{ inputs.force }}" == "true" ] && args="$args --force"
          [ "${{ inputs.dry_run }}" == "true" ] && args="$args --dry-run"
          node scripts/build-static.mjs $args

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update content cache [$(date -u +%Y-%m-%d)]"
          git push
